name: Build Windows Binaries (x64 + arm64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binary-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前端（rust-embed 编译期嵌入 web-ui/dist）
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: 安装 Rust 工具链 + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # aarch64-pc-windows-msvc 交叉：cc crate 对非 host msvc target 用 clang-cl（windows-latest 自带 VS clang）
      - name: 设置交叉编译环境（arm64）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Output "VS: $vs"
          # clang-cl 位于 VS 的 LLVM 组件
          $clang = Get-ChildItem "$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe" -ErrorAction SilentlyContinue
          if (-not $clang) { Write-Error "VS clang-cl 未安装（需 C++ Clang tools 组件）"; exit 1 }
          Write-Output "CC_AARCH64_PC_WINDOWS_MSVC=$($clang.FullName)" | Out-File $env:GITHUB_ENV -Append
          # 链接器：arm64 目标默认用 link.exe——确保 VS ARM64 工具集存在
          Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\arm64\link.exe" | Select-Object -First 1

      - name: cargo build (release, ${{ matrix.target }})
        env:
          CC_aarch64_pc_windows_msvc: ${{ env.CC_AARCH64_PC_WINDOWS_MSVC }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包 exe + 前端 zip
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}".StartsWith("x86_64")) { "x64" } else { "arm64" }
          $exe = Join-Path (Get-Location) "target\${{ matrix.target }}\release\reader-dev.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe 未生成"; exit 1 }
          New-Item -ItemType Directory -Force dist, dist-pkg\web-ui | Out-Null
          Copy-Item $exe "dist\reader-dev-windows-$arch.exe"
          Copy-Item $exe "dist-pkg\reader-dev-windows-$arch.exe"
          Copy-Item web-ui\dist\* dist-pkg\web-ui\ -Recurse -Force
          Compress-Archive -Path dist-pkg\* -DestinationPath "dist\reader-dev-windows-$arch.zip" -Force
          Write-Host "exe 大小: $((Get-Item $exe).Length) bytes"

      - name: 上传 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-dev-windows-${{ matrix.target }}
          path: |
            dist/reader-dev-windows-*.exe
            dist/reader-dev-windows-*.zip
          if-no-files-found: error

      - name: 上传到 GitHub Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/reader-dev-windows-*.exe
            dist/reader-dev-windows-*.zip
