name: Build Linux Static Binaries (x64 + arm64, musl)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binary-linux
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前端（rust-embed 编译期嵌入 web-ui/dist）
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: 安装 Rust 工具链 + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cargo-zigbuild：统一处理 ring/libsqlite3-sys/zstd 等 C 依赖的交叉编译，
      # 产出完全静态的 musl 二进制——无 glibc 版本依赖（Debian 11/12 等任意发行版可跑）
      - name: 安装 zig + cargo-zigbuild
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo zigbuild (release, ${{ matrix.target }})
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: 打包静态二进制 + 前端 zip
        run: |
          arch=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "x64")
          bin="target/${{ matrix.target }}/release/reader-dev"
          mkdir -p dist dist-pkg/web-ui
          cp "$bin" "dist/reader-dev-linux-$arch-musl"
          chmod +x "dist/reader-dev-linux-$arch-musl"
          cp "$bin" "dist-pkg/reader-dev-linux-$arch-musl"
          chmod +x "dist-pkg/reader-dev-linux-$arch-musl"
          cp -r web-ui/dist dist-pkg/web-ui/
          cd dist-pkg && zip -qr ../dist/reader-dev-linux-$arch.zip . && cd ..

      - name: 校验静态链接（无 glibc 动态依赖）
        run: |
          file dist/reader-dev-linux-*-musl 2>/dev/null || true
          if command -v ldd >/dev/null 2>&1; then
            echo "动态依赖检查（应显示 not a dynamic executable）："
            ldd dist/reader-dev-linux-*-musl 2>&1 | head -5 || true
          fi

      - name: 上传 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-dev-linux-${{ matrix.target }}
          path: |
            dist/reader-dev-linux-*.musl
            dist/reader-dev-linux-*.zip
          if-no-files-found: error

      - name: 上传到 GitHub Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/reader-dev-linux-*.musl
            dist/reader-dev-linux-*.zip
