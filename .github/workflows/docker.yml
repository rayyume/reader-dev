name: Build & Push Docker (amd64 + arm64)

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-multiarch
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # secrets 不能在 if: 中直接引用（解析即失败）——经 job 级 env 中转判断
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 登录 Docker Hub（可选——未配置 secrets 时跳过）
        if: env.DH_USER != '' && env.DH_PASS != ''
        run: echo "$DH_PASS" | docker login -u "$DH_USER" --password-stdin

      - name: 生成镜像标签（多 tag → 多个 -t 参数）
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="ghcr.io/$REPO_LC:latest ghcr.io/$REPO_LC:${{ github.ref_name }}"
          else
            TAGS="ghcr.io/$REPO_LC:master"
          fi
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS -t $t"; done
          echo "tags_args=$ARGS" >> $GITHUB_OUTPUT
          echo "repo=$REPO_LC" >> $GITHUB_OUTPUT

      - name: 构建并推送多架构镜像（amd64 + arm64，type=gha 缓存）
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            ${{ steps.meta.outputs.tags_args }} \
            .

      - name: 同步推送 Docker Hub（可选）
        if: env.DH_USER != '' && env.DH_PASS != ''
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DH_TAGS="$DH_USER/reader-dev:latest $DH_USER/reader-dev:${{ github.ref_name }}"
          else
            DH_TAGS="$DH_USER/reader-dev:master"
          fi
          ARGS=""
          for t in $DH_TAGS; do ARGS="$ARGS -t $t"; done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha \
            $ARGS \
            .
