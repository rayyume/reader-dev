name: Release Rust Binaries

on:
  push:
    tags:
      - 'v5.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-rust
  cancel-in-progress: true

jobs:
  # ================= Linux musl 静态二进制（含前端 zip）+ GitHub Release =================
  build-release:
    runs-on: ubuntu-latest
    env:
      # sccache：Rust 编译缓存（GitHub Actions cache 远端持久化——hosted runner 每次全新）
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发版保护（tag 提交必须为 master 祖先）
        shell: bash
        run: |
          git fetch origin master --quiet || true
          if git merge-base --is-ancestor $GITHUB_SHA origin/master; then
            echo 'OK 允许发版'
          else
            echo "SHA $GITHUB_SHA 非 master 祖先——拒绝发版"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm（~/.npm + node_modules——lockfile 变化才失效）
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            web-ui/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 构建前端（npm ci 走 lockfile——比 npm install 快且可复现）
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust（stable + musl 目标——hosted runner 网络稳定）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 安装 musl 链接器（musl-gcc——libsqlite3-sys/ring/zstd-sys 等 C 依赖）
        run: |
          if command -v musl-gcc >/dev/null 2>&1; then
            echo "musl-gcc 已安装——跳过 apt"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          fi

      - name: 缓存 cargo registry（hosted runner 跨 run 复用依赖下载）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: 启动 sccache（Rust 编译缓存——GHA cache 持久化）
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: 构建 Rust release（musl 静态链接——无 glibc 依赖，Debian 12/任何发行版可跑）
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: 打包 Linux 静态二进制（含前端 dist——单独二进制无 web-ui 会 404）
        run: |
          mkdir -p dist dist-pkg/web-ui
          cp target/x86_64-unknown-linux-musl/release/reader-dev dist-pkg/reader-dev-linux-x64-musl
          chmod +x dist-pkg/reader-dev-linux-x64-musl
          cp -r web-ui/dist dist-pkg/web-ui/dist
          cd dist-pkg
          # 注意：不要加 -i .（旧版曾只打包根目录，产出 22 字节空 zip）
          zip -qr ../dist/reader-dev-linux-x64.zip .
          cd ..
          cp dist-pkg/reader-dev-linux-x64-musl dist/reader-dev-linux-x64-musl
          chmod +x dist/reader-dev-linux-x64-musl

      - name: 校验静态链接
        run: |
          if command -v file >/dev/null 2>&1; then
            file dist/reader-dev-linux-x64.zip
          else
            echo "file 命令不可用——跳过静态校验"
          fi

      - name: 发布 GitHub Release（linux musl 含前端 zip）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/reader-dev-linux-x64.zip
            dist/reader-dev-linux-x64-musl
          generate_release_notes: true

  # ================= Windows 签名 exe（GitHub hosted runner）=================
  build-windows-signed:
    runs-on: windows-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建前端（rust-embed 编译期嵌入 web-ui/dist）
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 rust 工具链（~/.rustup——hosted runner 跨 run 复用）
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-stable
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: 缓存 cargo（registry + target）
        uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release

      - name: 打包 Windows exe（签名已移除——SmartScreen 提示属预期）
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "target\release\reader-dev.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe 未生成"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe (Join-Path (Get-Location) "dist\reader-dev-windows-x64.exe")
          Write-Host "exe 大小: $((Get-Item $exe).Length) bytes"

      - name: 上传 exe 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/reader-dev-windows-x64.exe
